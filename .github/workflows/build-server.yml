name: Build Server

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read

env:
  DOTNET_CONFIG: Release
  # Auth for restoring org packages (RakNexus, AssetData.Parser.Core) from GitHub Packages.
  NuGetPackageSourceCredentials_github: Username=actions;Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime: [ 'win-x64', 'linux-x64', 'osx-x64', 'osx-arm64' ]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
    - name: Check out sources
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build server
      run: dotnet build ReCap.Server/ReCap.Server.csproj --configuration ${{ env.DOTNET_CONFIG }} --runtime ${{ matrix.runtime }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ReCapServer-${{ matrix.runtime }}
        path: ReCap.Server/bin/${{ env.DOTNET_CONFIG }}/net10.0/${{ matrix.runtime }}
